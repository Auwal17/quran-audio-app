name: quran_recitation
description: >
  Offline Quran Audio App - A production-ready Android application providing
  complete offline audio experience of the Holy Quran with beautiful Islamic-inspired design.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Audio
  just_audio: ^0.9.31
  audio_service: ^0.18.11
  audio_session: ^0.1.16

  # Navigation
  go_router: ^13.0.0

  # Local Storage
  shared_preferences: ^2.2.2

  # UI & Design
  google_fonts: ^6.1.0
  flutter_launcher_icons: ^0.13.1

  # Utility
  intl: ^0.19.0
  path_provider: ^2.1.1
  permission_handler: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/audio/
    - assets/images/
    - assets/data/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

flutt_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
